<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Attendence App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <div class="container d-flex align-items-center justify-content-between gap-2">
      <div class="brand"><i class="bi bi-patch-check-fill"></i> MINI ATTENDENCE</div>
      <span id="modeBadge" class="mode-badge"></span>
    </div>
  </header>

  <main class="container py-4">

    <div id="errBanner" class="alert-box d-none"></div>

    <!-- Date + actions -->
    <section class="card-nb head-card mb-4">
      <div class="row g-3 align-items-end">
        <div class="col-12 col-md-4">
          <label class="lbl" for="datePicker">Date</label>
          <input type="date" id="datePicker" class="nb-input">
        </div>
        <div class="col-6 col-md-4">
          <button id="markAllBtn" class="nb-btn nb-mint w-100"><i class="bi bi-check2-all"></i> Sab Present</button>
        </div>
        <div class="col-6 col-md-4">
          <button class="nb-btn nb-yellow w-100" data-bs-toggle="modal" data-bs-target="#studentModal">
            <i class="bi bi-person-plus-fill"></i> Student
          </button>
        </div>
      </div>
      <div class="mt-3">
        <div class="d-flex justify-content-between lbl mb-1">
          <span>Aaj ki attendance</span><span id="pctText">0%</span>
        </div>
        <div class="bar"><div id="barFill"></div></div>
      </div>
    </section>

    <!-- Stats -->
    <section class="row g-3 mb-4">
      <div class="col-6 col-lg-3"><div class="card-nb stat s-blue"><i class="bi bi-people-fill"></i><h3 id="sTotal">0</h3><p>Total</p></div></div>
      <div class="col-6 col-lg-3"><div class="card-nb stat s-mint"><i class="bi bi-check-circle-fill"></i><h3 id="sPresent">0</h3><p>Present</p></div></div>
      <div class="col-6 col-lg-3"><div class="card-nb stat s-coral"><i class="bi bi-x-circle-fill"></i><h3 id="sAbsent">0</h3><p>Absent</p></div></div>
      <div class="col-6 col-lg-3"><div class="card-nb stat s-yellow"><i class="bi bi-clock-fill"></i><h3 id="sLeave">0</h3><p>Leave</p></div></div>
    </section>

    <!-- Students -->
    <section class="card-nb p-3 p-md-4">
      <h5 class="sec-title"><i class="bi bi-list-check"></i> STUDENTS</h5>
      <div id="studentList"></div>
    </section>
  </main>

  <!-- Add student modal -->
  <div class="modal fade" id="studentModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content nb-modal" id="studentForm">
        <div class="modal-header">
          <h5 class="modal-title">NAYA STUDENT</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <label class="lbl" for="stName">Naam</label>
          <input type="text" id="stName" class="nb-input mb-3" placeholder="Student ka naam" required>
          <label class="lbl" for="stRoll">Roll No</label>
          <input type="text" id="stRoll" class="nb-input" placeholder="Jaise 101" required>
        </div>
        <div class="modal-footer border-0 pt-0">
          <button type="submit" class="nb-btn nb-mint w-100">Add Student</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="appToast" class="toast nb-toast border-0">
      <div class="d-flex">
        <div class="toast-body" id="toastMsg"></div>
        <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
